<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TUNNELRAT</title>
<style>
  :root { --bg:#07090d; --accent:#5cff8a; --accent2:#ffb13b; --danger:#ff3b3b; --cyan:#39d0ff; }
  * { box-sizing:border-box; margin:0; padding:0; user-select:none; }
  body { background:var(--bg); color:#fff; font-family:'Courier New',monospace; overflow:hidden; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* ---- Loading / title ---- */
  #loading { position:absolute; inset:0; z-index:30; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:#05070a; }
  #loading h1 { font-size:80px; letter-spacing:14px; color:var(--accent); font-weight:900;
    text-shadow:0 0 40px rgba(92,255,138,.45); }
  #loading .sub { color:#6d7a90; letter-spacing:7px; margin:6px 0 40px; font-size:15px; }
  #loading .status { color:var(--accent2); letter-spacing:3px; font-size:18px; animation:blink 1.1s infinite; }
  @keyframes blink { 50% { opacity:.35; } }

  /* ---- HUD (filled by src/hud.js) ---- */
  #hud { position:absolute; inset:0; z-index:5; pointer-events:none; display:none; }

  /* ---- Automap overlay canvas slot ---- */
  #mapNote { position:absolute; top:14px; right:16px; z-index:6; color:#5a6678; font-size:12px;
    letter-spacing:2px; pointer-events:none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.179.0",
    "three/addons/": "https://esm.sh/three@0.179.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<div id="mapNote">TAB: AUTOMAP</div>
<div id="loading">
  <h1>TUNNELRAT</h1>
  <div class="sub">6DOF PROCGEN MINE CRAWLER</div>
  <div class="status" id="loadStatus">DESCENDING...</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
